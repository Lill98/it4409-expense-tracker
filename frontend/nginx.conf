server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén text để giảm dung lượng truyền.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Không để lộ version Nginx trong response header.
    server_tokens off;

    # --- Frontend (SPA) ---
    location / {
        # Vấn đề routing của SPA (Lec 10): route do JavaScript xử lý, nên
        # truy cập trực tiếp /expenses/abc123 sẽ 404 vì file đó không tồn tại
        # trên disk. try_files trả về index.html để React Router tự định tuyến.
        try_files $uri $uri/ /index.html;
    }

    # Asset có hash trong tên file nên không bao giờ đổi nội dung -> cache dài.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html KHÔNG được cache, nếu không người dùng sẽ mãi nhận bản cũ
    # và trỏ tới các file asset đã bị xoá sau khi deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- Backend API (reverse proxy) ---
    # Backend không phơi ra Internet; mọi request đi qua Nginx (Lec 10).
    # `backend` là service name trong docker-compose, Docker DNS tự phân giải.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
