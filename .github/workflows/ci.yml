name: CI

# Trigger (Lec 10): mỗi push và mỗi pull request là một chốt kiểm tra chất lượng.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend - smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Smoke test tự dựng MongoDB in-memory nên CI không cần service database.
      - name: Run smoke test
        working-directory: backend
        run: npm run smoke

  frontend:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker - build images
    runs-on: ubuntu-latest
    # Chỉ build image sau khi cả hai job kiểm tra đã pass.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t expense-tracker-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t expense-tracker-frontend:${{ github.sha }} ./frontend
